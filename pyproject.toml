[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ma3lib"
version = "0.5.6"
description = "Comparateur et nettoyeur de librairies GDTF pour grandMA3"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pdfplumber>=0.11", "keyring>=24"]  # pdfplumber : lecture des notices PDF (section « Créer »)

[project.scripts]
ma3lib = "ma3lib.cli:main"

[project.gui-scripts]
ma3lib-gui = "ma3lib.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ma3lib = ["data/*.json", "data/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
